name: Lint, Build, and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare-environment:
    name: Prepare environment
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.get-node-versions.outputs.node-versions }}
      latest-version: ${{ steps.get-node-versions.outputs.latest-version }}
      shards: ${{ steps.shards.outputs.shards }}
      shard-count: ${{ steps.shards.outputs.count }}
    steps:
      - name: Get Node versions
        id: get-node-versions
        env:
          SUPPORTED_VERSIONS: |
            22.x
            24.x
            26.x
          ALL: ${{
            github.ref_name == 'main' ||
            startsWith(github.head_ref, 'release/') ||
            startsWith(github.base_ref, 'release/') ||
            startsWith(github.event.merge_group.base_ref, 'refs/heads/release/')
            }}
        run: |
          supported=$(jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))' <<< "$SUPPORTED_VERSIONS")
          latest=$(jq --raw-output 'last' <<< "$supported")

          echo "latest-version=$latest" >> "$GITHUB_OUTPUT"

          if [[ "$ALL" == "true" ]]; then
            echo "node-versions=$supported" >> "$GITHUB_OUTPUT"
          else
            echo "node-versions=[\"$latest\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Get test shards
        id: shards
        env:
          COUNT: 10
        run: |
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 1 "$COUNT" | jq -sc .)" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs:
      - prepare-environment
    strategy:
      matrix:
        node-version: ${{ fromJson(needs.prepare-environment.outputs.node-versions) }}
    outputs:
      child-workspace-package-names: ${{ steps.workspace-package-names.outputs.child-workspace-package-names }}
      merge-base: ${{ steps.fetch-merge-base.outputs.merge-base }}
      package-names: ${{ steps.packages.outputs.package-names }}
      changed-paths: ${{ steps.packages.outputs.changed-paths }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          cache-node-modules: true
          node-version: ${{ matrix.node-version }}
          force-setup: true
      - name: Fetch workspace package names
        id: workspace-package-names
        run: |
          echo "child-workspace-package-names=$(yarn workspaces list --no-private --json | jq --slurp --raw-output 'map(.name) | @json')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Fetch merge base
        id: fetch-merge-base
        if: matrix.node-version == needs.prepare-environment.outputs.latest-version && (github.base_ref != '' || github.event.merge_group.base_ref != '')
        run: |
          set -euo pipefail

          PREFIXED_REF_REGEX='refs/heads/(.+)'
          if [[ "$BASE_REF" =~ $PREFIXED_REF_REGEX ]]; then
            BASE_REF="${BASH_REMATCH[1]}"
          fi

          MERGE_BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_SHA" --jq '.merge_base_commit.sha')
          git fetch --unshallow --filter=blob:none --no-tags origin HEAD

          echo "merge-base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: Get changed package names
        id: packages
        if: matrix.node-version == needs.prepare-environment.outputs.latest-version
        run: |
          if [[ -n "$MERGE_BASE" ]]; then
            OUTPUT=$(yarn get-changed-workspaces --merge-base "$MERGE_BASE" --head-ref "$HEAD_SHA")
            PACKAGES=$(echo "$OUTPUT" | jq -c '.names')
            if [[ $(echo "$OUTPUT" | jq '.hasRootChange') == "true" ]]; then
              CHANGED_PATHS="full"
            else
              CHANGED_PATHS=$(echo "$OUTPUT" | jq -c '.locations')
            fi
          else
            PACKAGES=$(yarn workspaces list --no-private --json | jq --slurp --raw-output 'map(.name) | @json')
            CHANGED_PATHS="full"
          fi
          echo "package-names=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "changed-paths=$CHANGED_PATHS" >> "$GITHUB_OUTPUT"
        env:
          MERGE_BASE: ${{ steps.fetch-merge-base.outputs.merge-base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  lint:
    name: Lint (${{ matrix.script }})
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    strategy:
      fail-fast: false
      matrix:
        script:
          - codeowners:check
          - constraints
          - lint:dependencies
          - lint:misc:check
          - lint:teams
          - lint:tsc:check
          - lint:tsconfigs:all
          - messenger-action-types:check
          - readme-content:check
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - name: Run yarn ${{ matrix.script }}
        run: yarn "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  lint-oxlint:
    name: Lint (lint:oxlint)
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.changed-paths != '[]'
    needs:
      - prepare
      - prepare-environment
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - name: Lint
        run: yarn lint:oxlint
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  validate-changelogs:
    name: Validate changelogs
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - name: Fetch merge base commit
        if: needs.prepare.outputs.merge-base != '' && startsWith(github.head_ref || github.ref_name, 'release/')
        run: git fetch --depth=1 --filter=blob:none --no-tags origin "$MERGE_BASE"
        env:
          MERGE_BASE: ${{ needs.prepare.outputs.merge-base }}
      - name: Validate changelogs
        run: yarn changelog:validate:all
        env:
          CHANGELOG_MERGE_BASE: ${{ needs.prepare.outputs.merge-base }}
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  validate-changelog-diffs:
    name: Validate changelog diffs
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate changelog diffs
        uses: ./.github/actions/check-merge-queue-changelogs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - name: Build
        run: yarn build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - run: yarn test:scripts --coverage
      - run: yarn test:scripts:shell
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.prepare-environment.outputs.node-versions) }}
        shard: ${{ fromJson(needs.prepare-environment.outputs.shards) }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: yarn vitest --reporter=blob --reporter=default --shard "$SHARD/$SHARD_COUNT"
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare-environment.outputs.shard-count }}
          VITEST_BLOB_LABEL: ${{ matrix.node-version }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.node-version }}-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  merge-test-reports:
    name: Merge test reports
    runs-on: ubuntu-latest
    needs:
      - prepare-environment
      - test
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: .vitest/blob/
          merge-multiple: true
      - name: Merge reports
        run: yarn vitest --merge-reports --reporter default --silent

  build-platform-api-docs:
    name: Build Platform API docs
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prepare-environment
    permissions:
      contents: read
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ needs.prepare-environment.outputs.latest-version }}

      - name: Generate and build Platform API docs
        run: yarn docs:platform-api:build
