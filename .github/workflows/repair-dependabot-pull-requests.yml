name: Repair Dependabot pull requests

on:
  pull_request:
    # Deliberately not `synchronize`: this job pushes to the pull request branch, and reacting to its own push would loop.
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  repair:
    name: Repair constraints, lockfile and changelogs
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    environment: dependabot
    permissions:
      contents: read
      id-token: write
    steps:
      # Dependabot runs get a read-only `GITHUB_TOKEN` and no repository secrets, so the push is authorised by an OIDC exchange instead.
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@7e0d74bc7b79ce9601e52f58d5e4d36c19591df9 # v1.19.0
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write

      # Explicitly the head branch, because on a `pull_request` event the default checkout is the merge ref and we push this branch back. Full history is for the merge base below.
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name 'metamask-ci[bot]'
          git config user.email '271559518+metamask-ci[bot]@users.noreply.github.com'

      - name: Get merge base and starting commit
        id: refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          {
            echo "merge-base=$(git merge-base HEAD "refs/remotes/origin/$BASE_REF")"
            echo "start-sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The action installs with an explicit `yarn --immutable`, which Dependabot's lockfile does not always satisfy. Every install in this job has to be free to rewrite it, so do our own.
      - name: Set up environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: false
          skip-install: true

      - name: Install dependencies
        uses: MetaMask/action-retry-command@2377689bfd9a03010a956b7c14273a2fc43d20cf # v1.0.1
        with:
          command: yarn install --no-immutable
          max-retries: 5

      - name: Align dependency ranges
        env:
          ALIGN_DEPENDENCY_RANGES: 'true'
        run: yarn constraints --fix

      - name: Apply dependency range updates
        uses: MetaMask/action-retry-command@2377689bfd9a03010a956b7c14273a2fc43d20cf # v1.0.1
        with:
          command: yarn install --no-immutable
          max-retries: 5

      - name: Commit the aligned ranges
        run: |
          set -euo pipefail
          git add -- package.json '**/package.json' yarn.lock
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: align dependency ranges across the monorepo'

      - name: Deduplicate dependency tree
        run: yarn dedupe

      - name: Commit the deduplicated lockfile
        run: |
          set -euo pipefail
          git add -- yarn.lock
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: deduplicate yarn.lock'

      - name: Write changelog entries for the bumped dependencies
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_BASE: ${{ steps.refs.outputs.merge-base }}
          CHANGELOG_BASE_REF: ${{ steps.refs.outputs.merge-base }}
        run: yarn changelog:validate --checkDeps --fix --currentPr "$PR_NUMBER" --fromRef "$MERGE_BASE"
        # Entries can be written even when other validation errors remain, and those are still worth committing.
        continue-on-error: true

      - name: Commit the changelog entries
        run: |
          set -euo pipefail
          git add -- '**/CHANGELOG.md'
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: add changelog entries for bumped dependencies'

      - name: Push the repairs
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          START_SHA: ${{ steps.refs.outputs.start-sha }}
          TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
            echo 'Nothing to repair.'
            exit 0
          fi

          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$PR_HEAD_REF"
