name: Repair dependency upgrade pull requests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

env:
  # Deliberately not `metamask-ci[bot]`: that is the identity Renovate commits under, and Renovate only leaves a branch alone once it sees a commit from someone else.
  REPAIR_COMMIT_NAME: 'github-actions[bot]'
  REPAIR_COMMIT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check whether the last commit was a repair
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'metamask-ci[bot]' && startsWith(github.event.pull_request.head.ref, 'renovate/')) }}
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.last-author.outputs.needed }}
    steps:
      - name: Read the author of the last commit
        id: last-author
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          author="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.author.email')"
          if [[ "$author" == "$REPAIR_COMMIT_EMAIL" ]]; then
            echo 'The last commit is a repair, nothing to do.'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  repair:
    name: Repair constraints, lockfile and changelogs
    needs: check
    if: ${{ needs.check.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    environment: dependabot
    permissions:
      contents: read
      id-token: write
    steps:
      # Dependabot runs get a read-only `GITHUB_TOKEN` and no repository secrets, so the push is authorised by an OIDC exchange instead.
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write

      # Explicitly the head branch, because on a `pull_request` event the default checkout is the merge ref and we push this branch back. Full history is for the merge base below.
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$REPAIR_COMMIT_NAME"
          git config user.email "$REPAIR_COMMIT_EMAIL"

      - name: Get merge base and starting commit
        id: refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          {
            echo "merge-base=$(git merge-base HEAD "refs/remotes/origin/$BASE_REF")"
            echo "start-sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The action installs with an explicit `yarn --immutable`, which Dependabot's lockfile does not always satisfy. Every install in this job has to be free to rewrite it, so do our own.
      - name: Set up environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-install: true

      - name: Install dependencies
        uses: MetaMask/action-retry-command@v1
        with:
          command: yarn install --no-immutable
          max-retries: 5

      - name: Align dependency ranges
        env:
          ALIGN_DEPENDENCY_RANGES: 'true'
        run: yarn constraints --fix

      - name: Apply dependency range updates
        uses: MetaMask/action-retry-command@v1
        with:
          command: yarn install --no-immutable
          max-retries: 5

      - name: Commit the aligned ranges
        run: |
          set -euo pipefail
          git add -- package.json '**/package.json' yarn.lock
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: align dependency ranges across the monorepo'

      - name: Deduplicate dependency tree
        run: yarn dedupe

      - name: Commit the deduplicated lockfile
        run: |
          set -euo pipefail
          git add -- yarn.lock
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: deduplicate yarn.lock'

      - name: Write changelog entries for the bumped dependencies
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_BASE: ${{ steps.refs.outputs.merge-base }}
          CHANGELOG_BASE_REF: ${{ steps.refs.outputs.merge-base }}
        run: yarn changelog:validate --checkDeps --fix --currentPr "$PR_NUMBER" --fromRef "$MERGE_BASE"
        # Entries can be written even when other validation errors remain, and those are still worth committing.
        continue-on-error: true

      - name: Commit the changelog entries
        run: |
          set -euo pipefail
          git add -- '**/CHANGELOG.md'
          git diff --cached --quiet || git commit -m '[dependabot skip] chore: add changelog entries for bumped dependencies'

      - name: Push the repairs
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          START_SHA: ${{ steps.refs.outputs.start-sha }}
          TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
            echo 'Nothing to repair.'
            exit 0
          fi

          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$PR_HEAD_REF"
