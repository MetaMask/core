# Creates a comment on each pull request which lists the files changed so far,
# broken down by the teams that own them. This fixes a major pain point with
# GitHub's UI, providing much needed clarity for authors (who want to know the
# minimal set of teams they should seek approval from) and reviewers (who want
# to know the minimal set of files they ought to look at). In addition, files
# within packages that are co-owned by Core Platform (manifests, changelogs,
# etc.) are separated and hidden by default, so that authors do not ask this
# team for reviews when they shouldn't.
#
# To ensure that the comment does not get buried, it is re-created whenever the
# branch is updated (earlier instances are hidden as outdated).
#
# You can run `yarn create-codeownership-summary` to see the content of the
# comment locally.

name: Post codeownership summary

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: post-codeownership-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  post-codeownership-summary:
    name: Post codeownership summary
    # Fork and Dependabot PRs get a read-only token, so they cannot receive
    # the comment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout and setup base commit
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          # GitHub uses the base branch when looking up ownership rules, so we
          # use the base commit so we can access its copy of the script as well
          # as `codeowners.ts`.
          ref: ${{ github.event.pull_request.base.sha }}
          # Pull full history, as Git needs it to find the commit where the pull
          # request branched off from the base branch (the merge base). But to
          # keep things fast, use `filter` to only fetch commits, not file
          # contents (Git will download file contents only when requested).
          fetch-depth: 0
          filter: blob:none
          is-high-risk-environment: false
          persist-credentials: false

      - name: Fetch pull request head
        run: git fetch --no-tags origin "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Generate summary
        # Write the output to a file, not GITHUB_OUTPUT, to ensure that GitHub
        # doesn't get confused when it attempts to parse the multiline output string.
        run: yarn create-codeownership-summary --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" > "$RUNNER_TEMP/codeownership-summary.md"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Hide previous comments and post new comment
        uses: actions/github-script@v9
        env:
          SUMMARY_PATH: ${{ runner.temp }}/codeownership-summary.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- CODEOWNERSHIP SUMMARY -->';
            const summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const summaryCommentIds = comments
              .filter(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  comment.body?.startsWith(marker),
              )
              .map((comment) => comment.node_id);

            // The REST API doesn't say whether a comment is hidden, so look
            // that up, 100 comments at a time (the most `nodes` accepts).
            for (let i = 0; i < summaryCommentIds.length; i += 100) {
              const { nodes } = await github.graphql(`
                query($ids: [ID!]!) {
                  nodes(ids: $ids) {
                    ... on IssueComment {
                      id
                      isMinimized
                    }
                  }
                }
              `, {
                ids: summaryCommentIds.slice(i, i + 100),
              });

              for (const node of nodes) {
                if (node && !node.isMinimized) {
                  await github.graphql(`
                    mutation($commentId: ID!, $classifier: ReportedContentClassifiers!) {
                      minimizeComment(input: {subjectId: $commentId, classifier: $classifier}) {
                        minimizedComment {
                          isMinimized
                        }
                      }
                    }
                  `, {
                    commentId: node.id,
                    classifier: 'OUTDATED',
                  });
                }
              }
            }

            if (summary) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${summary}`,
              });
            }
