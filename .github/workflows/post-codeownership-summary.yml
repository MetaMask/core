# Creates a comment on each pull request which lists the files changed so far,
# broken down by the teams that own them. This fixes a major pain point with
# GitHub's UI, providing much needed clarity for authors (who want to know the
# minimal set of teams they should seek approval from) and reviewers (who want
# to know the minimal set of files they ought to look at). In addition, files
# within packages that are co-owned by Core Platform (manifests, changelogs,
# etc.) are separated and hidden by default, so that authors do not ask this
# team for reviews when they shouldn't.
#
# Only one such comment is kept on a pull request: it is updated whenever the
# branch is updated, and removed if no changed files have codeowners.
#
# You can run `yarn create-codeownership-summary` to see the content of the
# comment locally.

name: Post codeownership summary

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: post-codeownership-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  post-codeownership-summary:
    name: Post codeownership summary
    # Fork and Dependabot PRs get a read-only token, so they cannot receive
    # the comment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The summary compares the pull request with the commit where it
      # branched off from the base branch (the merge base). Rather than fetching
      # the repository's full history so that Git can find that commit, ask
      # GitHub for it, along with how many commits the pull request has, so
      # that only those commits need to be fetched.
      - name: Get merge base
        id: merge-base
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '"merge-base=\(.merge_base_commit.sha)\nfetch-depth=\(.ahead_by + 1)"' \
            >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}

      - name: Checkout and setup pull request head
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          # Use the pull request's copy of the script, so that it works even if
          # the base branch doesn't have the script or has an older version.
          ref: ${{ github.event.pull_request.head.sha }}
          # Every commit on the pull request is fewer than this many commits
          # away from its head, so this depth reaches back to the merge base,
          # which lets Git compare the pull request against it. To keep things
          # fast, use `filter` to only fetch commits, not file contents (Git
          # will download file contents only when requested).
          fetch-depth: ${{ steps.merge-base.outputs.fetch-depth }}
          filter: blob:none
          is-high-risk-environment: false
          persist-credentials: false

      # GitHub uses the base branch to apply ownership rules to a pull request,
      # so in order to be accurate, the summary should use the same logic that
      # generated those rules.
      #
      # Because of `filter: blob:none` above, Git may need to download the base
      # branch's copy of this file on demand. That works even though
      # `persist-credentials` is false, because this repository is public, and
      # fetching from a public repository doesn't require credentials.
      - name: Use the base branch's ownership rules
        run: |
          git fetch --depth=1 --no-tags origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- codeowners.ts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Generate summary
        # Write the output to a file, not GITHUB_OUTPUT, to ensure that GitHub
        # doesn't get confused when it attempts to parse the multiline output string.
        run: |
          if yarn create-codeownership-summary --base-ref "$MERGE_BASE" --head-ref HEAD > "$RUNNER_TEMP/codeownership-summary.md"; then
            exit 0
          else
            exitcode=$?
            cat "$RUNNER_TEMP/codeownership-summary.md"
            exit "$exitcode"
          fi
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.merge-base }}

      - name: Create, update, or delete comment
        uses: actions/github-script@v9
        env:
          SUMMARY_PATH: ${{ runner.temp }}/codeownership-summary.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- CODEOWNERSHIP SUMMARY -->';
            const summary = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8');
            const body = `${marker}\n${summary}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // There should be at most one, but earlier versions of this workflow
            // posted a new comment on each run, so update the latest
            const existingComment = comments.findLast(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.startsWith(marker),
            );

            if (!summary) {
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                });
              }
            } else if (!existingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } else if (existingComment.body !== body) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            }
