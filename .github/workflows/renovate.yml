name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Renovate log level'
        type: choice
        options: ['info', 'debug']
        default: 'info'

permissions:
  contents: read

jobs:
  renovate:
    name: Scan dependencies
    runs-on: ubuntu-latest
    environment: renovate
    permissions:
      contents: read
      id-token: write
    steps:
      # Renovate authenticates as metamask-ci via the same OIDC exchange the other workflows use, so there is no personal access token and no Renovate GitHub App.
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write
            issues: write

      # Pinned to a commit rather than a tag: zizmor's `unpinned-uses` policy only allows ref-pins for `actions/*` and `MetaMask/*`.
      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          RENOVATE_TOKEN: ${{ steps.get-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # `dependencyDashboardApproval` in renovate.json means this opens no pull requests. It writes a single dashboard issue and waits for a checkbox.
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
