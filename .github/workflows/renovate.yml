name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Renovate log level'
        type: choice
        options: ['info', 'debug']
        default: 'info'

permissions:
  contents: read

jobs:
  renovate:
    name: Scan dependencies
    runs-on: ubuntu-latest
    environment: renovate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write
            issues: write
            workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          # The action defaults this to the floating `44` tag. 44.107.0 runs the global Yarn 1.22.22 instead of the version in `packageManager`, so every lockfile update fails. Bump once that is fixed upstream.
          renovate-version: 44.112.3
        env:
          RENOVATE_TOKEN: ${{ steps.get-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
